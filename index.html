<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expense Recorder Voice Capture</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#131724;--muted:#697386;--line:#e6e8ef;--blue:#2266ea;--purple:#7a3df0;--pink:#d725bd;--danger:#c83f49;--ok:#16794a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}.hero{padding:24px 20px 42px;background:linear-gradient(125deg,var(--blue),var(--purple) 58%,var(--pink));color:#fff;border-radius:0 0 28px 28px}.hero h1{margin:0;font-size:26px}.hero p{margin:7px 0 0;color:rgba(255,255,255,.86);font-size:13px}.wrap{max-width:520px;margin:-26px auto 0;padding:0 14px 24px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(23,31,56,.08)}.mic{width:100px;height:100px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));color:#fff;font-size:38px;display:block;margin:10px auto 14px;cursor:pointer}.mic.listening{animation:pulse 1.1s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.state{text-align:center;font-weight:850;font-size:18px}.hint{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 16px}textarea{width:100%;min-height:120px;border:1.5px solid #d9ddea;border-radius:14px;padding:13px;font-size:17px;line-height:1.45;resize:vertical;outline:none}textarea:focus{border-color:#7f83ff;box-shadow:0 0 0 4px rgba(105,92,255,.09)}.primary{width:100%;min-height:50px;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(95deg,var(--blue),var(--purple),var(--pink));color:#fff;font-size:15px;font-weight:850;cursor:pointer}.secondary{width:100%;min-height:46px;margin-top:9px;border:1px solid var(--line);border-radius:14px;background:#f7f8fc;color:var(--ink);font-weight:800;cursor:pointer}.msg{margin-top:11px;font-size:12px;line-height:1.45}.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}.example{margin-top:14px;padding:11px;border-radius:12px;background:#f7f8fc;color:var(--muted);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="hero"><h1>Expense Recorder Voice</h1><p>Secure top-level microphone capture · v2.3</p></div>
<div class="wrap"><div class="card"><button id="mic" class="mic" aria-label="Start listening">🎙</button><div id="state" class="state">Tap the microphone</div><div class="hint">Say your expense naturally. You do not need commas.</div><textarea id="transcript" placeholder="1500 dinner McDonald's Aileen couple"></textarea><button id="send" class="primary">USE THIS EXPENSE</button><button id="retry" class="secondary">LISTEN AGAIN</button><div id="msg" class="msg"></div><div class="example">Example: <b>1500 dinner McDonald's Aileen couple</b><br>Business: <b>3000 Facebook ads George business Bridge</b></div></div></div>
<script>
const $=id=>document.getElementById(id);const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null,stream=null;
function setMsg(text,ok=false){$('msg').textContent=text||'';$('msg').className='msg '+(text?(ok?'ok':'err'):'')}
async function ensureMicrophone(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('This browser cannot access the microphone here.');stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());stream=null}
async function startListening(){setMsg('');$('state').textContent='Checking microphone…';if(!SpeechRecognition){$('state').textContent='Voice recognition unavailable';setMsg('Chrome speech recognition is not available on this device. You can still type the expense above and press USE THIS EXPENSE.');return}try{await ensureMicrophone()}catch(err){$('state').textContent='Microphone unavailable';setMsg('The browser could not open the microphone on this page. You can type the expense above and press USE THIS EXPENSE.');return}recognition=new SpeechRecognition();recognition.lang='en-US';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;let finalText='';recognition.onstart=()=>{$('mic').classList.add('listening');$('state').textContent='Listening…';setMsg('Speak now.',true)};recognition.onresult=event=>{let interim='';finalText='';for(let i=event.resultIndex;i<event.results.length;i++){const text=event.results[i][0].transcript;if(event.results[i].isFinal)finalText+=text;else interim+=text}$('transcript').value=(finalText||interim).trim()};recognition.onerror=event=>{$('mic').classList.remove('listening');$('state').textContent='Could not recognize speech';if(event.error==='no-speech')setMsg('I did not hear anything. Tap LISTEN AGAIN.');else setMsg('Speech recognition failed. You can tap LISTEN AGAIN or type the expense manually.')};recognition.onend=()=>{$('mic').classList.remove('listening');if($('transcript').value.trim()){$('state').textContent='Captured';setMsg('Review the words, then press USE THIS EXPENSE.',true)}else if($('state').textContent==='Listening…')$('state').textContent='Ready'};try{recognition.start()}catch(err){$('mic').classList.remove('listening');$('state').textContent='Ready';setMsg('Tap LISTEN AGAIN.')}}
function sendBack(){const text=$('transcript').value.trim();if(!text){setMsg('Say or type an expense first.');return}if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'expense-voice-transcript',text:text},'*');$('state').textContent='Sent';setMsg('Expense sent back to your recorder.',true);setTimeout(()=>window.close(),350)}else{navigator.clipboard?.writeText(text);setMsg('The recorder window is no longer open. The text has been copied if your browser allowed it.')}}
$('mic').addEventListener('click',startListening);$('retry').addEventListener('click',startListening);$('send').addEventListener('click',sendBack);
</script>
</body>
</html>
